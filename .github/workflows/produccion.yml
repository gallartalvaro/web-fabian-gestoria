name: Publicar en producción (Hostinger)

# main es producción. Todo lo que llega aquí se publica, así que el
# camino normal es: trabajar en la rama "pruebas", revisarla en
# GitHub Pages y, cuando esté conforme, pasarla a main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  publicar:
    name: Subir la web a Hostinger
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://valentramites.com

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar que el sitio está completo
        run: |
          cd public
          for pagina in index.html subvenciones.html privacidad.html \
                        ayuda-emprende-y-concilia.html \
                        ayuda-hosteleria-equipamiento.html \
                        ayuda-emdana-emprendimiento.html; do
            test -f "$pagina" || { echo "Falta public/$pagina"; exit 1; }
          done
          test -f .htaccess || { echo "Falta public/.htaccess"; exit 1; }
          echo "Las seis páginas y el .htaccess están en su sitio."

      - name: Probar el receptor de contactos
        run: node backend/test-worker.mjs

      - name: Comprobar que hay credenciales de FTP
        id: credenciales
        env:
          SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
        run: |
          if [ -z "$SERVIDOR" ]; then
            echo "listo=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Publicación pendiente de configurar"
              echo ""
              echo "Faltan los secretos \`FTP_SERVIDOR\`, \`FTP_USUARIO\` y \`FTP_CONTRASENA\`."
              echo "Se crean en **Settings → Secrets and variables → Actions** con los datos de"
              echo "*hPanel → Archivos → Cuentas FTP*."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Revisar el formato de las credenciales
        if: steps.credenciales.outputs.listo == 'si'
        env:
          USUARIO: ${{ secrets.FTP_USUARIO }}
          CLAVE: ${{ secrets.FTP_CONTRASENA }}
        run: |
          # Un espacio o un salto de línea colado al copiar y pegar es
          # la causa mas frecuente de "530 Login incorrect". Se informa
          # solo de la longitud: el valor nunca se imprime.
          revisar() {
            etiqueta="$1"; valor="$2"
            limpio=$(printf '%s' "$valor" | tr -d '[:space:]')
            if [ "${#valor}" -ne "${#limpio}" ]; then
              echo "AVISO · $etiqueta lleva espacios o saltos de línea: ${#valor} caracteres, ${#limpio} sin ellos. Vuelva a guardarlo sin espacios."
            else
              echo "OK · $etiqueta: ${#valor} caracteres, sin espacios."
            fi
          }
          revisar FTP_USUARIO "$USUARIO"
          revisar FTP_CONTRASENA "$CLAVE"

      - name: Subir por FTP a public_html
        if: steps.credenciales.outputs.listo == 'si'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_CONTRASENA }}
          # FTP con TLS: sin esto, el usuario y la contraseña viajarían
          # en claro desde el servidor de GitHub hasta Hostinger.
          protocol: ftps
          port: 21
          # Solo el contenido de public/: al servidor no llega ni el
          # receptor, ni la documentación, ni nada propio de git.
          local-dir: ./public/
          server-dir: public_html/

      - name: Resumen
        if: steps.credenciales.outputs.listo == 'si'
        run: |
          {
            echo "### Publicado en producción"
            echo ""
            echo "https://valentramites.com"
            echo ""
            echo "Commit publicado: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
