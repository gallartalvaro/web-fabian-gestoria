name: Vigilancia de convocatorias

# Cada lunes revisa la BDNS y, si ha salido alguna ayuda que encaje
# con el despacho, abre una incidencia con el resumen. GitHub avisa
# por correo al propietario del repositorio.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás que se revisan"
        required: false
        default: "10"

permissions:
  contents: write
  issues: write

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  revisar:
    name: Buscar convocatorias nuevas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Consultar la BDNS
        id: buscar
        env:
          DIAS: ${{ github.event.inputs.dias || '10' }}
        run: node vigilancia/buscar-ayudas.mjs | tee salida.txt
        continue-on-error: true

      - name: Leer el resultado
        id: resultado
        run: |
          if [ ! -f salida.txt ] || ! grep -q "^HAY=" salida.txt; then
            echo "hay=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -E "^(HAY|CUANTAS)=" salida.txt | tr 'A-Z' 'a-z' >> "$GITHUB_OUTPUT"
          head -1 salida.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Avisar de que la vigilancia ha fallado
        if: steps.resultado.outputs.hay == 'error'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "La vigilancia de convocatorias ha fallado" \
            --body "La revisión semanal de la BDNS no ha podido completarse. Suele ser un corte puntual del servicio: se puede relanzar a mano desde Actions. Registro: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Abrir el aviso con las convocatorias
        if: steps.resultado.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "$(date +'%d/%m/%Y') · ${{ steps.resultado.outputs.cuantas }} convocatoria(s) que pueden interesar" \
            --body-file vigilancia/informe.md

      - name: Anotar lo ya revisado
        if: steps.resultado.outputs.hay != 'error'
        run: |
          git config user.name "Vigilancia de convocatorias"
          git config user.email "actions@github.com"
          git add vigilancia/vistas.json
          git diff --cached --quiet && exit 0
          # [skip ci] evita que este apunte dispare una publicación:
          # no toca nada de la web.
          git commit -m "Anotar las convocatorias ya revisadas [skip ci]"
          git push
